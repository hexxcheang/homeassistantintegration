<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maxsen Home preview</title>
    <style>
      :root {
        --bar-bg: #1f2530;
        --bar-text: #f1f3f6;
        --bar-muted: #a9b1bd;
        --bar-accent: #5aa9ff;
        --page-bg: #d9dde3;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--page-bg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        padding: 10px 16px;
        background: var(--bar-bg);
        color: var(--bar-text);
        font-size: 14px;
      }
      .brand { display: flex; flex-direction: column; margin-right: 6px; }
      .brand strong { font-size: 15px; }
      .brand span { font-size: 12px; color: var(--bar-muted); }
      .group { display: flex; align-items: center; gap: 8px; }

      .button, .toolbar button {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #2b3341;
        color: var(--bar-text);
        font: inherit;
        cursor: pointer;
      }
      .button:hover, .toolbar button:hover { background: #374155; }
      .button:focus-within, .toolbar button:focus-visible, .segmented label:focus-within {
        outline: 2px solid var(--bar-accent);
        outline-offset: 1px;
      }
      /* The file inputs stay in the page (Safari ignores clicks on display:none ones in some cases). */
      .button input[type='file'] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .button { position: relative; }

      .segmented { display: inline-flex; border: 1px solid #4a5568; border-radius: 6px; overflow: hidden; }
      .segmented label {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        background: #2b3341;
        cursor: pointer;
        white-space: nowrap;
      }
      .segmented label + label { border-left: 1px solid #4a5568; }
      .segmented input { position: absolute; opacity: 0; pointer-events: none; }
      .segmented label:has(input:checked) { background: var(--bar-accent); color: #0b1522; font-weight: 600; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
      .toggle input { width: 16px; height: 16px; accent-color: var(--bar-accent); }
      .toolbar select {
        min-height: 34px;
        max-width: 260px;
        padding: 0 10px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #2b3341;
        color: var(--bar-text);
        font: inherit;
        cursor: pointer;
      }
      .toolbar select:focus-visible { outline: 2px solid var(--bar-accent); outline-offset: 1px; }

      .status {
        flex: 1 1 260px;
        min-width: 0;
        color: var(--bar-muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .status.error { color: #ffb4a8; font-weight: 600; }

      .stage {
        flex: 1;
        display: flex;
        align-items: flex-start;
        overflow: auto;
        padding: 24px 16px 32px;
      }
      .frame {
        flex: none;
        /* Centred when there is room; when there is not, the stage scrolls instead of cutting it off. */
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 6px 28px rgba(15, 23, 42, 0.28);
        /* A light Home Assistant theme, so the panel looks as it will in the real thing. */
        --primary-color: #03a9f4;
        --text-primary-color: #fff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-color: #bdbdbd;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #fff;
        --secondary-background-color: #e5e5e5;
        --app-header-background-color: var(--primary-color);
        --app-header-text-color: var(--text-primary-color);
        --header-height: 56px;
      }
      .frame.panel { width: 1280px; height: 800px; border-radius: 4px; }
      .frame.phone {
        width: 390px;
        height: 844px;
        border: 10px solid #111;
        border-radius: 44px;
        /* border-box: the screen inside is 370 x 824; the phone's own width is the frame's outer width. */
      }
      maxsen-home-panel { display: flex; width: 100%; height: 100%; }

      .note { padding: 0 16px 16px; text-align: center; font-size: 12px; color: #596273; }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <strong>Maxsen Home preview</strong>
        <span>A simulated home. Nothing here talks to a real one.</span>
      </div>

      <div class="group">
        <label class="button">
          Open home file…
          <input id="home-file" type="file" accept=".json,application/json" />
        </label>
        <label class="button" title="Pretend the planner now has this home, for Refresh from planner">
          Planner update file…
          <input id="planner-file" type="file" accept=".json,application/json" />
        </label>
      </div>

      <div class="segmented" role="radiogroup" aria-label="Frame">
        <label><input type="radio" name="frame" value="panel" checked />Panel 1280×800</label>
        <label><input type="radio" name="frame" value="phone" />Phone 390×844</label>
      </div>

      <div class="group">
        <select id="press" aria-label="Press a device" title="Flip a fake device, as if someone pressed it: the walk and press-to-identify listen for this">
          <option value="">Press a device…</option>
        </select>
        <button id="unlink-all" type="button" title="Unlink every marker, so the linking walk has something to do">Unlink everything</button>
      </div>

      <div class="group">
        <label class="toggle"><input id="admin" type="checkbox" checked />Admin</label>
        <label class="toggle"><input id="installer" type="checkbox" checked />Installer mode</label>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </header>

    <main class="stage">
      <div id="frame" class="frame panel"></div>
    </main>
    <p class="note">
      Sensors flip on their own: the door sensors open and close every 20 seconds.
    </p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
